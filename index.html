<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quick setup guide for pinning and opening the YouTube Comment History Chrome extension.">
    <title>YouTube Comment History - Quick Setup</title>
    <base href="/youtube-comment-history/">
    <link rel="icon" href="icons/icon-32.png" sizes="32x32">
    <link rel="stylesheet" href="welcome.css">
    <script
        defer
        src="https://cloud.umami.is/script.js"
        data-website-id="d772cce4-d753-45ee-8d08-f19a9645a72d"
        data-domains="nastenku.github.io"
        data-tag="youtube-comment-history"
    ></script>
</head>
<body>
    <main class="page-shell">
        <header class="intro">
            <h1>Keep the extension one click away</h1>
        </header>
        <section class="steps" aria-label="YouTube Comment History quick setup steps">
            <article class="step-card">
                <img src="marketing/tutorial-1-cropped.png" alt="Chrome Extensions menu with YouTube Comment History and the pin control highlighted.">
                <div class="step-copy">
                    <ol class="mini-steps" start="1">
                        <li>Click the puzzle icon in the Chrome toolbar.</li>
                        <li>Find YouTube Comment History and click the pin icon.</li>
                    </ol>
                </div>
            </article>
            <article class="step-card">
                <img src="marketing/tutorial-2-cropped.png" alt="YouTube Comment History pinned in the Chrome toolbar with the side panel search highlighted.">
                <div class="step-copy">
                    <ol class="mini-steps" start="3">
                        <li>Click the YouTube Comment History icon next to the address bar.</li>
                        <li>Search, filter, and open your YouTube comments from the side panel.</li>
                    </ol>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
